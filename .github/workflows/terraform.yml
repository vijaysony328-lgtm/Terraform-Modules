name: Terraform Backend Block

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure Context
        run: |
          echo "Checking Azure subscription..."
          az account show --query "{SubscriptionId:id, SubscriptionName:name, TenantId:tenantId}" -o table

          echo "Checking Resource Group..."
          az group show --name rg_backend -o table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform Backend Configuration
        working-directory: ./Backend_block
        run: |
          echo "Terraform files:"
          ls -la

          echo "===================================="
          echo "Current provider.tf:"
          echo "===================================="
          cat provider.tf

      - name: Terraform Init
        working-directory: ./Backend_block
        run: terraform init

      - name: Terraform Validate
        working-directory: ./Backend_block
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./Backend_block
        run: terraform plan
